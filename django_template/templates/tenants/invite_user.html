{% extends "base.html" %}

{% block content %}
  <main class="mx-auto max-w-2xl px-6 py-12">
    <h1 class="text-2xl font-semibold">Invite a user to {{ tenant.name }}</h1>
    <p class="mt-2 text-sm text-gray-600">The user will receive an email and must accept before tenant access is granted.</p>
    <form method="post" class="mt-8 space-y-6">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit" class="rounded-md bg-black px-4 py-2 text-white">Send invitation</button>
    </form>
  </main>
{% endblock content %}
